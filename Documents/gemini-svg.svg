<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .layer-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
      .box-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .sub-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .arrow-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
    </style>
    
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" class="bg" rx="12"/>

  <!-- SERVING LAYER -->
  <rect x="50" y="40" width="800" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="65" class="layer-title" fill="#1d4ed8">SERVING LAYER</text>
  <rect x="300" y="72" width="300" height="42" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="450" y="98" class="box-text" text-anchor="middle">📊 Power BI Dashboards</text>

  <!-- Arrow: Persistence to Serving -->
  <path d="M 450, 190 L 450, 132" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="165" class="arrow-text">Queries Unified Store</text>

  <!-- PERSISTENCE LAYER -->
  <rect x="50" y="190" width="800" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="70" y="215" class="layer-title" fill="#334155">PERSISTENCE LAYER</text>
  <rect x="300" y="222" width="300" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="248" class="box-text" text-anchor="middle">☁️ Azure HDFS Data Lake</text>

  <!-- Arrows to Persistence Layer -->
  <path d="M 250, 340 L 250, 282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="315" class="arrow-text">Appends Stream Results</text>

  <path d="M 650, 340 L 650, 282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="315" class="arrow-text">Batch Storage</text>

  <!-- SPEED LAYER -->
  <rect x="50" y="340" width="380" height="210" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="70" y="365" class="layer-title" fill="#c2410c">SPEED LAYER</text>
  
  <rect x="80" y="385" width="150" height="45" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="155" y="412" class="box-text" text-anchor="middle">🐍 Python Producer</text>

  <path d="M 230, 407 L 270, 407" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="385" width="140" height="45" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="340" y="412" class="box-text" text-anchor="middle">⚡ Apache Kafka</text>

  <path d="M 340, 430 L 340, 465" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="465" width="260" height="55" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="240" y="488" class="box-text" text-anchor="middle">🔥 Spark Streaming</text>
  <text x="240" y="506" class="sub-text" text-anchor="middle">(Real-Time Model Scoring)</text>

  <!-- BATCH LAYER -->
  <rect x="470" y="340" width="380" height="210" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="490" y="365" class="layer-title" fill="#15803d">BATCH LAYER</text>

  <rect x="500" y="390" width="320" height="45" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="660" y="417" class="box-text" text-anchor="middle">📁 Historical NYC Taxi Data</text>

  <path d="M 660, 435 L 660, 465" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="465" width="320" height="55" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="488" class="box-text" text-anchor="middle">⚙️ Offline Spark MLlib</text>
  <text x="660" y="506" class="sub-text" text-anchor="middle">(Trained ML Pipeline)</text>

  <!-- Model Deployment Arrow (Batch to Speed) -->
  <path d="M 500, 492 L 370, 492" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="435" y="485" class="arrow-text" text-anchor="middle">Deploys Model</text>

</svg>
